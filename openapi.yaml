openapi: 3.0.1
info:
  title: Main Openapi Yaml
  version: 0.1.0
servers:
- url: "{server}:{port}/"
  variables:
    server:
      default: http://localhost
    port:
      default: "9090"
paths:
  /diag:
    get:
      operationId: getDiag
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetails'
  /configured-version:
    get:
      operationId: getConfiguredVersion
      responses:
        "200":
          description: Ok
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    VersionDetails:
      required:
      - version
      type: object
      properties:
        version:
          type: string
